<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanare">
<meta name="theme-color" content="#1E3348">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Scanare documente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<style>
:root{
  --infield:#1E3348; --track:#D9822B; --chalk:#F3F5F8; --card:#FFFFFF; --ink:#1B2430;
  --muted:#667180; --border:#DCE1E8; --ok:#2E7D4F; --danger:#C0392B; --yellow:#E9B949;
  --soft:#FCEEDF; --sel:#EAF1FB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--chalk);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer}
header.sus{position:sticky;top:0;z-index:20;background:var(--infield);color:#fff;border-bottom:4px solid var(--track);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.sus h1{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;font-size:20px;letter-spacing:.6px;margin:0;font-weight:600;flex:1;white-space:nowrap}
#salvat{font-size:11.5px;opacity:.75;white-space:nowrap}
#sync{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:20px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
#sync:empty{display:none}
#sync.eroare{background:var(--danger);border-color:var(--danger)}
@media(max-width:400px){#salvat{display:none}}
main{padding:12px 12px calc(150px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
nav.jos{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.jos button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.jos button .ic{font-size:21px;line-height:24px;height:24px}
nav.jos button.activ{color:var(--track);font-weight:700}
nav.jos button.scan .ic{background:var(--track);color:#fff;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 3px 10px rgba(0,0,0,.25);border:3px solid #fff}
.view{display:none}.view.activ{display:block}
h2{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;font-size:17px;letter-spacing:.4px;margin:18px 4px 8px;color:var(--infield);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{font-size:16px;font-family:inherit;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#667180 50%),linear-gradient(135deg,#667180 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:24px;height:24px;-webkit-appearance:auto;appearance:auto;accent-color:var(--track);margin:0}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--track);color:#fff;font-weight:600;font-size:15px;padding:12px 16px;min-height:46px}
.btn.sec{background:#fff;color:var(--infield);border:1px solid var(--border)}
.btn.inchis{background:var(--infield)}
.btn.rosu{background:#fff;color:var(--danger);border:1px solid #F0C9C4}
.btn.mic{padding:8px 12px;min-height:38px;font-size:14px}
.btn.lat{width:100%}
.btn:disabled{opacity:.5}
.rand{display:flex;gap:8px;flex-wrap:wrap}
.rand>.btn{flex:1}
.muted{color:var(--muted)}
small{font-size:12.5px}
.gol{text-align:center;padding:30px 16px;color:var(--muted)}
.gol .mare{font-size:44px;margin-bottom:6px}

/* Documente */
.cauta{display:flex;gap:8px;margin-bottom:8px}
.filtre{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.filtre select{padding:8px 30px 8px 10px;font-size:16px}
.stat{display:flex;gap:8px;margin:6px 0 4px}
.stat div{flex:1;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-family:Oswald,sans-serif;color:var(--infield)}
.stat span{font-size:12px;color:var(--muted)}
.banner{background:var(--soft);border:1px solid #F1C99A;border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;font-size:14px}
.banner .btn{flex:none}
.luna{margin-top:14px}
.luna-cap{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:2px solid var(--infield)}
.luna-cap h3{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:16px;margin:0;flex:1;color:var(--infield);letter-spacing:.4px;font-weight:600}
.luna-cap .nr{font-size:12px;color:var(--muted)}
.luna-cap button.tg{background:none;border:0;font-size:15px;color:var(--infield);padding:6px 4px;font-weight:600}
.luna-cap button.bif{background:none;border:1px solid var(--border);border-radius:8px;font-size:12.5px;padding:5px 8px;color:var(--infield)}
.doc{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;margin-top:8px}
.doc.bifat{background:var(--sel);border-color:#9DB9E2}
.doc .chk{padding:6px 2px 6px 4px;display:flex}
.doc img,.doc .ph{width:52px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:#EEF1F5;flex:none}
.doc .info{flex:1;min-width:0}
.doc .info b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .info .l2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:#E6ECF4;color:var(--infield);margin-top:3px}
.trimis{display:inline-block;font-size:11.5px;color:var(--ok);font-weight:600;margin-left:6px}
.doc .gata{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--border);background:#fff;color:transparent;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.doc.rezolvat{border-left:5px solid var(--ok)}
.doc.rezolvat .gata{background:var(--ok);border-color:var(--ok);color:#fff}
.doc.rezolvat .info b{color:var(--ok)}
.eticheta-gata{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:#E3F2E8;color:var(--ok);margin:3px 0 0 6px}
.filtre .lat{grid-column:1 / -1}
.selbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:29;background:var(--infield);color:#fff;display:none;align-items:center;gap:8px;padding:10px 12px}
.selbar.vizibil{display:flex}
.selbar span{flex:1;font-weight:600}
.selbar .btn{min-height:40px;padding:8px 14px}
.selbar .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}

/* Editor */
.ed-cap{display:flex;align-items:center;gap:8px;margin:4px 2px 10px}
.ed-cap b{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{background:#2A3442;border-radius:12px;padding:10px;display:flex;justify-content:center;align-items:center;min-height:260px;position:relative}
.preview img{max-width:100%;max-height:58vh;box-shadow:0 2px 12px rgba(0,0,0,.4);background:#fff}
.preview .avert{position:absolute;top:10px;left:10px;right:10px;background:var(--yellow);color:#3B2C00;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;text-align:center}
.unelte{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.unelte button{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 2px;font-size:12px;color:var(--infield);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.unelte button .ic{font-size:19px}
.filtrebtn{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.filtrebtn button{flex:none;border:1px solid var(--border);background:#fff;border-radius:20px;padding:7px 12px;font-size:13.5px;color:var(--infield)}
.filtrebtn button.activ{background:var(--infield);color:#fff;border-color:var(--infield)}
.banda{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.banda .pg{flex:none;position:relative;border:2px solid transparent;border-radius:8px;padding:0;background:none}
.banda .pg.activ{border-color:var(--track)}
.banda .pg img{width:60px;height:80px;object-fit:cover;border-radius:6px;display:block;background:#fff}
.banda .pg i{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:11px;border-radius:5px;padding:0 5px}
.banda .pg .w{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--yellow);border:2px solid #fff}
.scanbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.scanbtns .btn{min-height:56px}
.pas{font-size:13.5px;color:var(--muted);margin:10px 4px}

/* Corner editor */
.ce{position:fixed;inset:0;z-index:100;background:#11161D;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.ce-top,.ce-jos{display:flex;align-items:center;gap:8px;padding:10px 12px}
.ce-top span{flex:1;text-align:center;font-size:14px;opacity:.85}
.ce-jos{justify-content:center}
.ce-zona{flex:1;position:relative;overflow:hidden;touch-action:none}
.ce-stage{position:absolute;touch-action:none}
.ce-stage canvas.img{position:absolute;inset:0;width:100%;height:100%}
.ce-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ce .h{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--track);background:rgba(217,130,43,.25);touch-action:none}
.ce .h::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}
.ce canvas.lupa{position:absolute;top:8px;width:120px;height:120px;border-radius:50%;border:3px solid #fff;display:none;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.5)}

/* Modals */
.fundal{position:fixed;inset:0;z-index:90;background:rgba(15,22,32,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:600px){.fundal{align-items:center}.modal{border-radius:16px}}
.modal h3{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:18px;margin:0 0 8px;color:var(--infield);font-weight:600}
.modal .act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal .act .btn{flex:1}
.optiune{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px}
.optiune input{width:22px;height:22px;margin-top:1px;-webkit-appearance:auto;appearance:auto;accent-color:var(--track);flex:none}
.optiune small{display:block;color:var(--muted)}
.segment{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.segment button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 4px;font-size:14px;color:var(--infield)}
.segment button.activ{background:var(--infield);color:#fff;border-color:var(--infield)}
.fis{font-size:13px;color:var(--muted);margin-top:8px;max-height:120px;overflow:auto}
.lucreaza{position:fixed;inset:0;z-index:200;background:rgba(15,22,32,.6);display:none;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-direction:column;gap:12px}
.lucreaza.vizibil{display:flex}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:300;background:#1B2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.vizibil{opacity:1}

/* Elevi & Setări */
.elev{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border)}
.elev:last-child{border-bottom:0}
.elev .n{flex:1;min-width:0}
.elev .n b{display:block;font-weight:600}
.elev button{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px;color:var(--infield)}
.autor{font-size:12.5px;color:var(--muted);text-align:center;margin:24px 8px 8px;line-height:1.5}
</style>
</head>
<body>
<header class="sus">
  <h1 id="titlu">Scanare documente</h1>
  <span id="salvat"></span>
  <button id="sync"></button>
</header>

<main>
  <!-- ============ DOCUMENTE ============ -->
  <section class="view activ" id="v-docs">
    <div id="bannerBackup"></div>
    <div class="stat" id="stat"></div>
    <div class="cauta"><input id="q" type="search" placeholder="Caută: elev, tip, nume, observații…" autocomplete="off"></div>
    <div class="filtre">
      <select id="fTip"></select>
      <select id="fClasa"></select>
      <select id="fGata" class="lat"><option value="">Toate documentele</option><option value="nu">○ Doar cele nebifate (de rezolvat)</option><option value="da">✓ Doar cele bifate (rezolvate)</option></select>
    </div>
    <div id="lista"></div>
  </section>

  <!-- ============ SCANEAZĂ / EDITOR ============ -->
  <section class="view" id="v-scan"></section>

  <!-- ============ ELEVI ============ -->
  <section class="view" id="v-elevi"></section>

  <!-- ============ SETĂRI ============ -->
  <section class="view" id="v-setari"></section>
</main>

<div class="selbar" id="selbar">
  <span id="selnr">0 bifate</span>
  <button class="btn sec" id="selAnul">Anulează</button>
  <button class="btn sec" id="selGata">✓ Rezolvate</button>
  <button class="btn" id="selTrimite">Trimite</button>
</div>

<nav class="jos">
  <button data-v="docs" class="activ"><span class="ic">📄</span>Documente</button>
  <button data-v="scan" class="scan"><span class="ic">📷</span>Scanează</button>
  <button data-v="elevi"><span class="ic">👥</span>Elevi</button>
  <button data-v="setari"><span class="ic">⚙️</span>Setări</button>
</nav>

<input type="file" id="inCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="inGalerie" accept="image/*" multiple hidden>
<input type="file" id="inBackup" accept=".json,application/json" hidden>

<div class="lucreaza" id="lucreaza"><div class="spin"></div><div id="lucreazaTxt">Se procesează…</div></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   SCANARE DOCUMENTE — aplicație web (PWA) pentru iPhone
   Concept: prof. Daniel Botezatu · realizată cu asistență AI (Claude)
   Toate datele stau pe telefon (IndexedDB). Backup: fișier JSON → Drive.
   ===================================================================== */
const VERSIUNE = '1.8';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LUNI = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
const pad = n => String(n).padStart(2, '0');
const azi = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const lunaCurenta = () => azi().slice(0, 7);
const numeLuna = l => { if (!l) return 'Fără lună'; const [y, m] = l.split('-'); return LUNI[+m - 1] + ' ' + y; };
const dataRo = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };
const faraDiacritice = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const norm = s => faraDiacritice(s).toLowerCase().trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const frame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function lunaAnterioara(l, k = 1) { let [y, m] = l.split('-').map(Number); m -= k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; }

const SETARI_IMPLICITE = {
  filtru: 'original',       // curat | gri | an | original
  proportie: 'auto',        // auto | a4
  calitate: 0.82,
  clasa: 'X F',
  tipuri: ['Adeverință medicală', 'Cerere de motivare (părinte)', 'Cerere', 'Scutire medicală EFS', 'Declarație', 'Altul'],
};
const FILTRE = [['curat', 'Color curat'], ['gri', 'Gri'], ['an', 'Alb-negru'], ['original', 'Original']];

/* ---------------- Stare ---------------- */
const S = {
  docs: [], elevi: [], setari: { ...SETARI_IMPLICITE },
  sel: new Set(), deschise: new Set([lunaCurenta()]), ultimaLuna: null, lastBackup: null,
  view: 'docs',
};
const E = { docId: null, pages: [], cur: 0 };   // editorul (document nou = ciorne)

/* ---------------- IndexedDB ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('scanare_db', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('pages')) d.createObjectStore('pages', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      let out;
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Salvare întreruptă (spațiu insuficient?)'));
    });
  },
  get: (s, id) => DB._run(s, 'readonly', st => st.get(id)),
  all: (s) => DB._run(s, 'readonly', st => st.getAll()),
  // fiecare modificare făcută aici intră automat în coada de sincronizare
  async put(s, v, o = {}) {
    const urmarit = (s === 'docs' || s === 'pages') && !o.remote;
    if (urmarit) v.m = Date.now();
    await DB._run(s, 'readwrite', st => st.put(v)); marcheazaSalvat();
    if (urmarit) marcheazaSync(s === 'docs' ? 'doc' : 'pag', v.id, 'put');
  },
  async del(s, id, o = {}) {
    const urmarit = (s === 'docs' || s === 'pages') && !o.remote;
    let n = 0;
    if (urmarit && s === 'pages') { const r = await DB.get('pages', id); n = r && r.urcat ? (r.n || 0) : 0; }
    await DB._run(s, 'readwrite', st => st.delete(id)); marcheazaSalvat();
    if (urmarit) marcheazaSync(s === 'docs' ? 'doc' : 'pag', id, 'del', n);
  },
  async meta(k, def) { const r = await DB.get('meta', k); return r ? r.v : def; },
  async setMeta(k, v, o = {}) {
    await DB.put('meta', { k, v, m: Date.now() });
    if (!o.remote && (k === 'elevi' || k === 'setari')) marcheazaSync('meta', k, 'put');
  },
};

function marcheazaSalvat() {
  const d = new Date();
  $('#salvat').textContent = `Salvat ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('vizibil');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('vizibil'), ms);
}
async function lucreaza(on, txt = 'Se procesează…') {
  $('#lucreazaTxt').textContent = txt;
  $('#lucreaza').classList.toggle('vizibil', on);

  x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height);
  x.drawImage(c, poz === 'stanga' ? banda : 0, poz === 'sus' ? banda : 0);
  x.save();
  if (poz === 'sus') x.translate(o.width - marg - lung, 0);
  else if (poz === 'jos') x.translate(o.width - marg - lung, c.height);
  else if (poz === 'dreapta') { x.translate(o.width, marg); x.rotate(Math.PI / 2); }
  else { x.translate(0, marg + lung); x.rotate(-Math.PI / 2); }
  x.fillStyle = '#F6D9CB'; x.fillRect(0, 0, lung, banda);
  x.fillStyle = '#5A2A16'; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  randuri.forEach((r, i) => x.fillText(r, lung / 2, pad + lh * i + lh / 2));
  x.restore();
  return o;
}
/* Pagina: originalul se păstrează, ca să poți corecta oricând colțurile */
async function proceseaza(pg, origC, o = {}) {
  origC = origC || await blobInCanvas(pg.orig, 2400);
  let c = indreapta(origC, pg.colturi, S.setari.proportie);
  aplicaFiltru(c, pg.filtru);
  c = roteste(c, pg.rot || 0);
  c = adaugaMesaj(c, pg.mesaj);
  pg.final = await canvasInBlob(c, S.setari.calitate);
  pg.fw = c.width; pg.fh = c.height;
  pg.thumb = await canvasInBlob(miniatura(c, 320), 0.75);
  elibereazaURL(pg.id); pg.v = (pg.v || 0) + 1;
  await DB.put('pages', pg, o);
  return pg;
}

/* =====================================================================
   PDF (generat direct în telefon, fără internet)
   ===================================================================== */
function facePDF(imagini) { // [{data:Uint8Array (JPEG), w, h}] → Blob; fiecare pagină A4
  const enc = new TextEncoder(); const parti = []; let poz = 0; const offs = [];
  const scrie = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parti.push(b); poz += b.length; };
  const obiect = (id, ...bucati) => { offs[id] = poz; scrie(`${id} 0 obj\n`); bucati.forEach(scrie); scrie('\nendobj\n'); };
  scrie(new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52, 10, 37, 226, 227, 207, 211, 10]));
  const n = imagini.length, kids = [];
  for (let i = 0; i < n; i++) kids.push(`${3 + i * 3} 0 R`);
  obiect(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obiect(2, `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`);
  imagini.forEach((im, i) => {
    const pid = 3 + i * 3, iid = pid + 1, cid = pid + 2;
    const peLat = im.w > im.h; const pw = peLat ? 841.89 : 595.28, ph = peLat ? 595.28 : 841.89;
    const m = 14; const sc = Math.min((pw - 2 * m) / im.w, (ph - 2 * m) / im.h);
    const dw = im.w * sc, dh = im.h * sc, dx = (pw - dw) / 2, dy = (ph - dh) / 2;
    const cont = `q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${dx.toFixed(2)} ${dy.toFixed(2)} cm /Im0 Do Q`;
    obiect(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`);
    obiect(iid, `<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`, im.data, '\nendstream');
    obiect(cid, `<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`);
  });
  const total = 3 + n * 3; const xref = poz;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  scrie(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parti, { type: 'application/pdf' });
}
async function pdfDinPagini(pagini) {
  const im = [];
  for (const p of pagini) im.push({ data: new Uint8Array(await p.final.arrayBuffer()), w: p.fw, h: p.fh });
  return facePDF(im);
}

async function incarcaTot() {

function migreazaDate() { // completează câmpurile lipsă, nu șterge nimic
  for (const d of S.docs) {
    d.pagini = d.pagini || []; d.trimis = d.trimis || [];
    d.luna = d.luna || (d.data || azi()).slice(0, 7);

  }

}
async function paginiDoc(d) {
  const out = [];
  for (const id of d.pagini) { const p = await DB.get('pages', id); if (p) out.push(p); }
  return out;
}
async function incarcaCiorne() {
  const toate = await DB.all('pages');
  E.docId = null;
  E.pages = toate.filter(p => p.docId === '__draft').sort((a, b) => (a.ord ?? a.creat) - (b.ord ?? b.creat));
  E.cur = Math.max(0, E.pages.length - 1);
}
async function salveazaOrdine() {
  if (E.docId) {
    const d = S.docs.find(x => x.id === E.docId);
    if (d) { d.pagini = E.pages.map(p => p.id); d.modificat = Date.now(); await DB.put('docs', d); }
  } else {
    for (let i = 0; i < E.pages.length; i++) if (E.pages[i].ord !== i) { E.pages[i].ord = i; await DB.put('pages', E.pages[i]); }
  }
}
const salveazaSetari = () => DB.setMeta('setari', S.setari);
const salveazaElevi = () => DB.setMeta('elevi', S.elevi);
function clase() {
  const s = new Set([S.setari.clasa]);
  S.elevi.forEach(e => e.clasa && s.add(e.clasa)); S.docs.forEach(d => d.clasa && s.add(d.clasa));
  return [...s].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ro'));
}
const eMedicala = tip => /medical/i.test(tip || '');
const scurt = x => dataRo(x).slice(0, 5);
function perioadaText(d) {
  if (!eMedicala(d.tip) || !d.perDe) return '';
  return !d.perPana || d.perPana === d.perDe ? scurt(d.perDe) : `${scurt(d.perDe)}–${scurt(d.perPana)}`;
}
function numeFisier(d) {
  const per = perioadaText(d);
  const baza = `${d.elev || 'Fara elev'} - ${d.tip} - ${per ? per.replace('–', '-') + ' - ' : ''}${dataRo(d.data)}`;
  return faraDiacritice(baza).replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 120);
}

function modal(html) {
  const f = document.createElement('div'); f.className = 'fundal';
  f.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(f);
  f.addEventListener('click', e => { if (e.target === f) inchide(); });
  function inchide() { f.remove(); }
  return { el: f.firstElementChild, inchide };
}
function confirma(text, da = 'Da', periculos = false) {

function potriveste(d) {
  if (F.tip && d.tip !== F.tip) return false;
  if (F.clasa && d.clasa !== F.clasa) return false;
  if (F.gata === 'da' && !d.gata) return false;
  if (F.gata === 'nu' && d.gata) return false;
  if (F.q) {
    const t = norm([d.nume, d.elev, d.tip, d.clasa, d.obs, numeLuna(d.luna), dataRo(d.data), perioadaText(d)].join(' '));
    return norm(F.q).split(/\s+/).every(c => t.includes(c));
  }
  return true;
}

async function adaugaFisiere(files) {
  if (!files.length) return;
  const nesigure = [];
  try {
    for (let i = 0; i < files.length; i++) {
      await lucreaza(true, files.length > 1 ? `Pagina ${i + 1} din ${files.length}…` : 'Caut marginile foii…');
      const c = await blobInCanvas(files[i], 2000);
      const orig = await canvasInBlob(c, 0.85);
      const det = detecteazaColturi(c);
      const pg = { id: uid(), docId: E.docId || '__draft', ord: E.pages.length, creat: Date.now(), orig, ow: c.width, oh: c.height,
        colturi: det.colturi, sigur: det.sigur, filtru: S.setari.filtru, rot: 0 };
      await proceseaza(pg, c);
      E.pages.push(pg); E.cur = E.pages.length - 1;
      if (!pg.sigur) nesigure.push(pg);
    }
    if (E.docId) await salveazaOrdine();
  } catch (e) { toast('Eroare: ' + e.message, 4000); }
  finally { await lucreaza(false); }
  if (S.view !== 'scan') arata('scan'); else randeazaEditor();
  if (nesigure.length === 1 && files.length === 1) {
    toast('Nu am găsit sigur marginile — potrivește colțurile.', 3500);
    await editeazaColturi(nesigure[0]);
  } else if (nesigure.length) toast(`${nesigure.length} pagini de verificat (punct galben).`, 3500);
}

/* ---------------- Editorul de colțuri ---------------- */
async function editeazaColturi(pg) {
  await lucreaza(true, 'Se deschide…');
  let origC;
  try { origC = await blobInCanvas(pg.orig, 2400); } finally { await lucreaza(false); }
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'ce';
    ov.innerHTML = `<div class="ce-top"><button class="btn mic sec" data-a="x">Anulează</button><span>Trage de colțuri</span><button class="btn mic" data-a="ok">Aplică</button></div>
      <div class="ce-zona"><div class="ce-stage"><canvas class="img"></canvas><svg><polygon fill="rgba(217,130,43,.18)" stroke="#D9822B" stroke-width="2"></polygon></svg>
      ${[0, 1, 2, 3].map(i => `<div class="h" data-i="${i}"></div>`).join('')}</div><canvas class="lupa" width="240" height="240"></canvas></div>
      <div class="ce-jos"><button class="btn mic sec" data-a="auto">Automat</button><button class="btn mic sec" data-a="tot">Toată poza</button></div>`;
    document.body.appendChild(ov);
    const zona = $('.ce-zona', ov), stage = $('.ce-stage', ov), cv = $('canvas.img', ov), poly = $('polygon', ov), lupa = $('canvas.lupa', ov);
    let col = pg.colturi.map(p => p.slice());
    let SW = 0, SH = 0;
    function aseaza() {
      const zw = zona.clientWidth - 40, zh = zona.clientHeight - 40;
      const s = Math.min(zw / origC.width, zh / origC.height);
      SW = origC.width * s; SH = origC.height * s;
      Object.assign(stage.style, { width: SW + 'px', height: SH + 'px', left: (zona.clientWidth - SW) / 2 + 'px', top: (zona.clientHeight - SH) / 2 + 'px' });
      cv.width = Math.round(SW * (window.devicePixelRatio || 1)); cv.height = Math.round(SH * (window.devicePixelRatio || 1));
      cv.getContext('2d').drawImage(origC, 0, 0, cv.width, cv.height);
      deseneaza();
    }
    function deseneaza() {
      $$('.h', ov).forEach((h, i) => { h.style.left = col[i][0] * SW + 'px'; h.style.top = col[i][1] * SH + 'px'; });
      poly.setAttribute('points', col.map(p => `${p[0] * SW},${p[1] * SH}`).join(' '));
    }
    function arataLupa(i) {
      const x = lupa.getContext('2d');
      const cx = col[i][0] * origC.width, cy = col[i][1] * origC.height;
      const L = Math.max(40, Math.min(origC.width, origC.height) / 10);
      x.fillStyle = '#000'; x.fillRect(0, 0, 240, 240);
      x.drawImage(origC, cx - L / 2, cy - L / 2, L, L, 0, 0, 240, 240);
      x.strokeStyle = '#D9822B'; x.lineWidth = 2; x.beginPath(); x.moveTo(120, 0); x.lineTo(120, 240); x.moveTo(0, 120); x.lineTo(240, 120); x.stroke();
      lupa.style.display = 'block';
      lupa.style.left = (col[i][0] < 0.5 ? zona.clientWidth - 132 : 12) + 'px';
    }
    $$('.h', ov).forEach(h => {
      const i = +h.dataset.i;
      h.addEventListener('pointerdown', e => {
        e.preventDefault(); h.setPointerCapture(e.pointerId);
        const r0 = stage.getBoundingClientRect();
        const ox = e.clientX - (r0.left + col[i][0] * SW), oy = e.clientY - (r0.top + col[i][1] * SH);
        const mv = ev => {
          const r = stage.getBoundingClientRect();
          col[i] = [Math.min(1, Math.max(0, (ev.clientX - ox - r.left) / SW)), Math.min(1, Math.max(0, (ev.clientY - oy - r.top) / SH))];
          deseneaza(); arataLupa(i);
        };
        const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); lupa.style.display = 'none'; };
        h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
        arataLupa(i);
      });
    });
    const inchide = r => { window.removeEventListener('resize', aseaza); ov.remove(); resolve(r); };
    $('[data-a="x"]', ov).onclick = () => inchide(false);
    $('[data-a="tot"]', ov).onclick = () => { col = COLTURI_TOT.map(p => p.slice()); deseneaza(); };
    $('[data-a="auto"]', ov).onclick = () => { const d = detecteazaColturi(origC); col = d.colturi; deseneaza(); toast(d.sigur ? 'Margini găsite' : 'Nu sunt sigur — verifică', 2000); };
    $('[data-a="ok"]', ov).onclick = async () => {
      // colțurile trebuie să formeze un patrulater convex, în ordinea corectă
      pg.colturi = ordoneazaColturi(col); pg.sigur = true;
      await lucreaza(true, 'Îndrept pagina…');
      try { await proceseaza(pg, origC); } finally { await lucreaza(false); }
      inchide(true); randeazaEditor();
    };
    window.addEventListener('resize', aseaza);
    requestAnimationFrame(aseaza);
  });
}

   ===================================================================== */
async function construiesteFisiere(ids, format) {
  const docs = ids.map(id => S.docs.find(d => d.id === id)).filter(Boolean)
    .sort((a, b) => a.luna.localeCompare(b.luna) || (a.data || '').localeCompare(b.data || '') || a.elev.localeCompare(b.elev, 'ro'));
  const files = [], folosite = new Set();
  const unic = n => { let k = n, i = 2; while (folosite.has(k.toLowerCase())) k = n.replace(/(\.\w+)$/, ` (${i++})$1`); folosite.add(k.toLowerCase()); return k; };
  if (format === 'unul') {
    const toate = []; for (const d of docs) toate.push(...await paginiDoc(d));
    const luni = [...new Set(docs.map(d => d.luna))];
    const nume = docs.length === 1 ? numeFisier(docs[0]) : faraDiacritice(`Documente ${luni.length === 1 ? numeLuna(luni[0]) : azi()} (${docs.length})`);
    files.push(new File([await pdfDinPagini(toate)], unic(nume + '.pdf'), { type: 'application/pdf' }));
  } else {
    for (const d of docs) {
      const pagini = await paginiDoc(d); if (!pagini.length) continue;
      if (format === 'pdf') files.push(new File([await pdfDinPagini(pagini)], unic(numeFisier(d) + '.pdf'), { type: 'application/pdf' }));
      else pagini.forEach((p, i) => files.push(new File([p.final], unic(numeFisier(d) + (pagini.length > 1 ? ` - p${i + 1}` : '') + '.jpg'), { type: 'image/jpeg' })));
    }
  }
  return files;
}
const marime = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

function deschideTrimite(ids) {
  if (!ids.length) return;

/* Pas 2: butonul care deschide meniul de partajare (trebuie apăsat de tine — regula Safari) */
function fereastraFisiere(files, titlu, laTrimis, nota = '') {
  const total = files.reduce((s, f) => s + f.size, 0);
  const poate = !!(navigator.canShare && navigator.canShare({ files }));
  const areFS = 'showSaveFilePicker' in window && 'showDirectoryPicker' in window && !/iPhone|iPad|iPod/.test(navigator.userAgent);
  const m = modal(`<h3>${titlu}</h3>
    <p>${files.length} ${files.length === 1 ? 'fișier' : 'fișiere'} · ${marime(total)}</p>
    <div class="fis">${files.map(f => esc(f.name)).join('<br>')}</div>
    ${nota ? `<p class="muted" style="font-size:13.5px">${nota}</p>` : ''}
    <div id="desc"></div>
    <div class="act"><button class="btn sec" data-x>Închide</button>${areFS ? `<button class="btn" data-f>📁 Salvează în folder…</button>` : ''}<button class="btn ${poate || areFS ? 'sec' : ''}" data-d>⬇ Descarcă</button>${poate ? `<button class="btn ${areFS ? 'sec' : ''}" data-s>📤 Trimite</button>` : ''}</div>
    ${areFS ? `<p class="muted" style="font-size:13px;margin:8px 0 0">„Salvează în folder” te lasă să alegi unde se salvează (Desktop, un folder de pe laptop, Drive pentru computer). Data viitoare se deschide în același loc.</p>` : ''}`);
  $('[data-x]', m.el).onclick = m.inchide;
  if (areFS) $('[data-f]', m.el).onclick = async () => {
    const scrie = async (h, f) => { const w = await h.createWritable(); await w.write(f); await w.close(); };
    try {
      if (files.length === 1) {
        const f = files[0], ext = (f.name.match(/\.(\w+)$/) || [, 'bin'])[1];
        const h = await window.showSaveFilePicker({ id: 'scanare', suggestedName: f.name, types: [{ description: ext.toUpperCase(), accept: { [f.type || 'application/octet-stream']: ['.' + ext] } }] });
        await scrie(h, f);
        toast('Salvat: ' + h.name, 3500);
      } else {
        const d = await window.showDirectoryPicker({ id: 'scanare', mode: 'readwrite' });
        for (const f of files) await scrie(await d.getFileHandle(f.name, { create: true }), f);
        toast(files.length + ' fișiere salvate în „' + d.name + '”', 3500);
      }
      m.inchide(); laTrimis && laTrimis();
    } catch (e) { if (e.name !== 'AbortError') toast('Nu s-a putut salva: ' + e.message, 4500); }
  };
  if (poate) $('[data-s]', m.el).onclick = async () => {
    try { await navigator.share({ files, title: titlu }); m.inchide(); toast('Trimis ✓'); laTrimis && laTrimis(); }
    catch (e) { if (e.name !== 'AbortError') toast('Nu s-a putut trimite: ' + e.message, 4000); }
  };
  $('[data-d]', m.el).onclick = () => {
    files.forEach((f, i) => setTimeout(() => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }, i * 400));
    toast('Descărcare pornită'); laTrimis && laTrimis(); m.inchide();
  };
}

async function pregatesteBackup(luna) {

  await lucreaza(true, 'Pregătesc backup-ul…');

    const parti = [`{"app":"scanare-documente","versiune":1,"exportat":${JSON.stringify(new Date().toISOString())},"luna":${JSON.stringify(luna)},"elevi":${JSON.stringify(S.elevi)},"setari":${JSON.stringify(S.setari)},"docs":${JSON.stringify(docs)},"pages":[`];
    let primul = true;

      primul = false;

}

    let nd = 0, np = 0;

    return 1;
  }
  if (doc) { const v = JSON.parse(d.d); v.m = d.m; await DB.put('docs', v, { remote: true }); return 1; }
  // pagină: aduc poza originală dacă n-o am
  let pg = loc;
  if (!pg || !pg.orig) {
    const parti = await Promise.all(Array.from({ length: d.n || 1 }, (_, j) => colRef().doc(`scanb_${d.id}_${j}`).get()));
    if (parti.some(x => !x.exists)) return 0;
    pg = { id: d.id, orig: dataURLInBlob('data:image/jpeg;base64,' + parti.map(x => x.data().s).join('')) };
  }
  const vechi = loc && loc.final ? cheieImagine(loc) : '';
  Object.assign(pg, parametriPagina(JSON.parse(d.d)), { m: d.m, urcat: true, n: d.n });
  if (!pg.final || vechi !== cheieImagine(pg)) await proceseaza(pg, null, { remote: true });
  else await DB.put('pages', pg, { remote: true });
  return 1;
}

async function urcaCoada() {
  if (!SY.uid || !SY.db || !SY.primit) return;
  if (SY.lucru) { programeazaUrcare(800); return; }
  if (!SY.coada.size) { stareSync('sincronizat'); return; }
  SY.lucru = true; stareSync('trimite'); let ok = true;
  try {
    for (const [key, val] of [...SY.coada]) {
      const i = key.indexOf(':'), tip = key.slice(0, i), id = key.slice(i + 1);
      const ref = colRef().doc(prefix(tip) + '_' + id);
      if (val.op === 'del') {
        const b = SY.db.batch();
        b.set(ref, { k: prefix(tip), id, sters: true, m: Date.now(), dev: SY.dev });
        for (let j = 0; j < (val.n || 0); j++) b.delete(colRef().doc(`scanb_${id}_${j}`));
        await b.commit();
      } else if (tip === 'meta') {
        const r = await DB.get('meta', id);
        if (r) await ref.set({ k: 'scanm', id, m: r.m || Date.now(), dev: SY.dev, d: JSON.stringify(r.v) });
      } else if (tip === 'doc') {
        const r = await DB.get('docs', id);
        if (r) await ref.set({ k: 'scand', id, m: r.m || Date.now(), dev: SY.dev, d: JSON.stringify(r) });
      } else {
        const r = await DB.get('pages', id);
        if (r) {
          const b = SY.db.batch(); let n = r.n || 0;
          if (!r.urcat) {
            const s = await blobInBase64(r.orig); n = Math.max(1, Math.ceil(s.length / PARTE));
            for (let j = 0; j < n; j++) b.set(colRef().doc(`scanb_${id}_${j}`), { s: s.slice(j * PARTE, (j + 1) * PARTE) });
          }
          b.set(ref, { k: 'scanp', id, m: r.m || Date.now(), dev: SY.dev, n, d: JSON.stringify(parametriPagina(r)) });
          await b.commit();
          if (!r.urcat) { const cur = await DB.get('pages', id); if (cur) { cur.urcat = true; cur.n = n; await DB.put('pages', cur, { remote: true }); } }
        }
      }
      if (SY.coada.get(key) === val) SY.coada.delete(key);
      await salveazaCoada();
    }
  } catch (e) {
    ok = false; console.warn(e);
    stareSync(e && e.code === 'permission-denied' ? 'eroare' : 'offline');
    if (e && e.code === 'permission-denied') toast('Contul a refuzat datele. Trimite-mi o captură din Setări.', 5000);
    setTimeout(() => programeazaUrcare(0), 20000);
  }
  SY.lucru = false;
  if (ok) { if (SY.coada.size) programeazaUrcare(300); else stareSync('sincronizat'); }
  if (S.view === 'setari' && !document.querySelector('.fundal')) randeazaSetari();
}

/* Reîncarc ce se vede, fără să stric o fereastră deschisă sau o prelucrare în curs */
const ocupat = () => !!document.querySelector('.ce, .fundal') || $('#lucreaza').classList.contains('vizibil');
async function reimprospateazaDupaSync(anunta) {
  if (ocupat()) { SY.deRandat = true; return; }
  SY.deRandat = false;
  const inainte = E.docId ? -1 : E.pages.length, curId = E.pages[E.cur]?.id;
  S.docs = await DB.all('docs'); migreazaDate();
  if (E.docId) {
    const d = S.docs.find(x => x.id === E.docId);
    if (d) { E.pages = await paginiDoc(d); const i = E.pages.findIndex(p => p.id === curId); E.cur = i >= 0 ? i : 0; }
    else await incarcaCiorne();
  } else {
    await incarcaCiorne();
    if (E.pages.length <= inainte) { const i = E.pages.findIndex(p => p.id === curId); if (i >= 0) E.cur = i; }
  }
  if (S.view === 'docs') randeazaDocs(); else if (S.view === 'scan') randeazaEditor(); else if (S.view === 'elevi') randeazaElevi();
  if (anunta && inainte >= 0 && E.pages.length > inainte) {
    const k = E.pages.length - inainte;
    toast(`📷 ${k === 1 ? 'O pagină nouă' : k + ' pagini noi'} de pe celălalt dispozitiv`, 3500);
    if (S.view === 'docs') $('nav.jos button[data-v=scan] .ic').textContent = '🔔';
  }
}
setInterval(() => { if (SY.deRandat && !ocupat()) reimprospateazaDupaSync(true); }, 1500);
$('nav.jos button[data-v=scan]').addEventListener('click', () => { $('nav.jos button[data-v=scan] .ic').textContent = '📷'; });

/* =====================================================================
   PORNIRE
   ===================================================================== */
(async function porneste() {
  try {
    await DB.open();
    await incarcaTot();
    await incarcaCiorne();
    await initSyncLocal();
    try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch (_) {}
    arata(E.pages.length ? 'scan' : 'docs');
    if (E.pages.length) toast(`Ai ${E.pages.length} pagini scanate nesalvate.`, 3500);
  } catch (e) {
    document.querySelector('main').innerHTML = `<div class="gol"><b>Aplicația nu poate salva date în acest browser.</b><br>${esc(e.message || e)}<br>Deschide-o în Safari (nu în modul privat).</div>`;
  }
  initSync();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('service-worker.js').catch(() => {});
})();
